<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome Alesio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --black: #0b0a0d;
    --pink-deep: #c94f7c;
    --pink-mid: #e07a9e;
    --pink-soft: #f2a9c2;
    --pink-btn: #d9709a;
    --pink-btn-hover: #c25f89;
    --cream: #fff3f7;
    --glow: rgba(240,150,190,0.35);
  }

  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
  }

  html,body{
    height:100%;
    overflow-x:hidden;
  }

  body{
    font-family:'Quicksand', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.03), transparent 40%),
      linear-gradient(115deg,
        var(--black) 0%,
        var(--black) 38%,
        #2a1420 48%,
        #5c2340 56%,
        var(--pink-deep) 66%,
        var(--pink-mid) 82%,
        var(--pink-soft) 100%
      );
    background-attachment: fixed;
  }

  /* soft floating sparkle dots for atmosphere */
  .sparkle{
    position:fixed;
    border-radius:50%;
    background:rgba(255,255,255,0.55);
    pointer-events:none;
    opacity:0;
    animation: twinkle 3.5s ease-in-out infinite;
  }

  @keyframes twinkle{
    0%,100%{opacity:0; transform:scale(0.6);}
    50%{opacity:0.85; transform:scale(1.1);}
  }

  .heart-float{
    position:fixed;
    pointer-events:none;
    color:rgba(255,255,255,0.55);
    font-size:14px;
    opacity:0;
    animation: floatUp 6s ease-in infinite;
    user-select:none;
  }

  @keyframes floatUp{
    0%{ transform:translateY(0) translateX(0) rotate(0deg); opacity:0; }
    10%{ opacity:0.7; }
    90%{ opacity:0.5; }
    100%{ transform:translateY(-90vh) translateX(20px) rotate(25deg); opacity:0; }
  }

  .stage{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:32px 24px 48px;
    max-width:440px;
    width:100%;
  }

  /* ---------- GIF CIRCLE ---------- */
  .circle-wrap{
    position:relative;
    width:190px;
    height:190px;
    margin-bottom:28px;
    opacity:0;
    transform:scale(0.4);
    animation: popIn 0.9s cubic-bezier(.34,1.56,.64,1) forwards;
  }

  .circle-ring{
    position:absolute;
    inset:-10px;
    border-radius:50%;
    background:conic-gradient(from 0deg, var(--pink-soft), var(--pink-deep), #ffffff33, var(--pink-soft));
    animation: spin 6s linear infinite;
    opacity:0.9;
  }

  .circle-ring::after{
    content:"";
    position:absolute;
    inset:6px;
    border-radius:50%;
    background: var(--black);
  }

  @keyframes spin{
    to{ transform:rotate(360deg); }
  }

  .circle-inner{
    position:absolute;
    inset:10px;
    border-radius:50%;
    overflow:hidden;
    background:#000;
    box-shadow:
      0 0 0 4px rgba(255,255,255,0.08),
      0 10px 40px var(--glow);
    animation: breathe 3.2s ease-in-out infinite;
  }

  .circle-inner img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  @keyframes breathe{
    0%,100%{ box-shadow:0 0 0 4px rgba(255,255,255,0.08), 0 10px 40px var(--glow); }
    50%{ box-shadow:0 0 0 4px rgba(255,255,255,0.14), 0 10px 55px var(--glow); }
  }

  @keyframes popIn{
    0%{ opacity:0; transform:scale(0.4); }
    60%{ opacity:1; transform:scale(1.08); }
    100%{ opacity:1; transform:scale(1); }
  }

  /* tiny hearts orbiting the circle */
  .mini-heart{
    position:absolute;
    font-size:16px;
    opacity:0;
  }

  /* ---------- TEXT ---------- */
  .headline{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:clamp(28px, 7vw, 38px);
    color:var(--cream);
    letter-spacing:0.3px;
    text-shadow: 0 2px 18px rgba(217,112,154,0.55);
    opacity:0;
    transform:translateY(14px);
  }

  .headline.show{
    animation: fadeUp 0.8s ease forwards;
  }

  .headline .heart-inline{
    display:inline-block;
    animation: pulse 1.4s ease-in-out infinite;
  }

  .subline{
    margin-top:10px;
    font-size:15px;
    font-weight:500;
    color:rgba(255,240,246,0.78);
    letter-spacing:0.2px;
    opacity:0;
    transform:translateY(10px);
  }

  .subline.show{
    animation: fadeUp 0.8s ease forwards;
  }

  @keyframes fadeUp{
    to{ opacity:1; transform:translateY(0); }
  }

  @keyframes pulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.18); }
  }

  /* ---------- BUTTON ---------- */
  .scan-btn{
    margin-top:26px;
    display:inline-flex;
    align-items:center;
    gap:9px;
    padding:14px 30px;
    border:none;
    border-radius:999px;
    background: linear-gradient(135deg, var(--pink-btn), #c15e88);
    color:#ffffff;
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:16px;
    letter-spacing:0.3px;
    cursor:pointer;
    box-shadow:
      0 6px 20px rgba(201,79,124,0.45),
      inset 0 1px 0 rgba(255,255,255,0.25);
    opacity:0;
    transform:translateY(12px) scale(0.9);
    transition: background 0.25s ease, box-shadow 0.25s ease, transform 0.15s ease;
  }

  .scan-btn.show{
    animation: popButton 0.7s cubic-bezier(.34,1.56,.64,1) forwards;
  }

  @keyframes popButton{
    0%{ opacity:0; transform:translateY(12px) scale(0.8); }
    70%{ opacity:1; transform:translateY(-2px) scale(1.05); }
    100%{ opacity:1; transform:translateY(0) scale(1); }
  }

  .scan-btn:hover{
    background: linear-gradient(135deg, var(--pink-btn-hover), #a94f76);
    box-shadow:
      0 8px 26px rgba(201,79,124,0.6),
      inset 0 1px 0 rgba(255,255,255,0.3);
    transform:translateY(-2px) scale(1.03);
  }

  .scan-btn:active{
    transform:translateY(0) scale(0.97);
  }

  .scan-btn svg{
    width:16px;
    height:16px;
    flex-shrink:0;
    animation: heartbeat 1.1s ease-in-out infinite;
  }

  @keyframes heartbeat{
    0%,100%{ transform:scale(1); }
    25%{ transform:scale(1.22); }
    45%{ transform:scale(0.95); }
  }

  .scan-btn:focus-visible{
    outline: 3px solid #ffffff;
    outline-offset: 3px;
  }

  @media (prefers-reduced-motion: reduce){
    *{
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  @media (max-width: 380px){
    .circle-wrap{ width:160px; height:160px; }
  }
</style>
</head>
<body>

<div class="stage">

  <div class="circle-wrap" id="circleWrap">
    <div class="circle-ring"></div>
    <div class="circle-inner">
      <img src="newhello.gif" alt="cute hello gif" id="heroGif"
           onerror="this.onerror=null; this.replaceWith(Object.assign(document.createElement('div'), {innerHTML:'💗', style:'font-size:64px;display:flex;align-items:center;justify-content:center;height:100%;width:100%;background:#1a0d13;'}));">
    </div>
  </div>

  <h1 class="headline" id="headline">Hello Handsome <span class="heart-inline">💗</span></h1>

  <p class="subline" id="subline">Have you scanned your cuteness for today?</p>

  <button class="scan-btn" id="scanBtn" onclick="goScan()">
    Scan now
    <svg viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 21s-6.7-4.35-9.3-8.28C1.02 10.6 1.4 7.4 3.9 5.7c2.1-1.43 4.7-.98 6.2 1.02.4.53.7 1.1 1.9 1.1s1.5-.57 1.9-1.1c1.5-2 4.1-2.45 6.2-1.02 2.5 1.7 2.88 4.9 1.2 7.02C18.7 16.65 12 21 12 21z"/>
    </svg>
  </button>

</div>

<script>
  // staggered reveal sequence
  window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => document.getElementById('headline').classList.add('show'), 1200);
    setTimeout(() => document.getElementById('subline').classList.add('show'), 2200);
    setTimeout(() => document.getElementById('scanBtn').classList.add('show'), 3100);
  });

  function goScan(){
    window.location.href = "scan.html";
  }

  // ambient floating sparkles
  function spawnSparkle(){
    const s = document.createElement('div');
    s.className = 'sparkle';
    const size = Math.random() * 3 + 2;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.animationDuration = (2.5 + Math.random() * 2.5) + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 6000);
  }
  setInterval(spawnSparkle, 500);

  // gentle floating hearts drifting up on the pink side
  const heartChars = ['💗','💕'];
  function spawnHeart(){
    const h = document.createElement('div');
    h.className = 'heart-float';
    h.textContent = heartChars[Math.floor(Math.random()*heartChars.length)];
    h.style.left = (55 + Math.random() * 40) + 'vw';
    h.style.bottom = '-5vh';
    h.style.fontSize = (12 + Math.random()*10) + 'px';
    h.style.animationDuration = (5 + Math.random()*3) + 's';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 9000);
  }
  setInterval(spawnHeart, 1400);
</script>

</body>
</html>
