<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>See you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --black: #0b0a0d;
    --pink-deep: #c94f7c;
    --pink-mid: #e07a9e;
    --pink-soft: #f2a9c2;
    --pink-btn: #d9709a;
    --pink-btn-hover: #c25f89;
    --cream: #fff3f7;
    --glow: rgba(240,150,190,0.35);
  }

  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html,body{
    height:100%;
    overflow-x:hidden;
  }

  body{
    font-family:'Quicksand', sans-serif;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.03), transparent 40%),
      linear-gradient(115deg,
        var(--black) 0%,
        var(--black) 38%,
        #2a1420 48%,
        #5c2340 56%,
        var(--pink-deep) 66%,
        var(--pink-mid) 82%,
        var(--pink-soft) 100%
      );
    background-attachment: fixed;
  }

  /* ambient sparkles + hearts, matching other pages */
  .sparkle{
    position:fixed;
    border-radius:50%;
    background:rgba(255,255,255,0.55);
    pointer-events:none;
    opacity:0;
    animation: twinkle 3.5s ease-in-out infinite;
  }

  @keyframes twinkle{
    0%,100%{opacity:0; transform:scale(0.6);}
    50%{opacity:0.85; transform:scale(1.1);}
  }

  .heart-float{
    position:fixed;
    pointer-events:none;
    color:rgba(255,255,255,0.55);
    font-size:14px;
    opacity:0;
    animation: floatUp 6s ease-in infinite;
    user-select:none;
  }

  @keyframes floatUp{
    0%{ transform:translateY(0) translateX(0) rotate(0deg); opacity:0; }
    10%{ opacity:0.7; }
    90%{ opacity:0.5; }
    100%{ transform:translateY(-90vh) translateX(20px) rotate(25deg); opacity:0; }
  }

  .stage{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:32px 26px 48px;
    max-width:420px;
    width:100%;
  }

  /* ---------- GIF CIRCLE ---------- */
  .circle-wrap{
    position:relative;
    width:190px;
    height:190px;
    margin-bottom:30px;
    opacity:0;
    transform:scale(0.4);
    animation: popIn 0.9s cubic-bezier(.34,1.56,.64,1) forwards;
  }

  .circle-ring{
    position:absolute;
    inset:-10px;
    border-radius:50%;
    background:conic-gradient(from 0deg, var(--pink-soft), var(--pink-deep), #ffffff33, var(--pink-soft));
    animation: spin 6s linear infinite;
    opacity:0.9;
  }

  .circle-ring::after{
    content:"";
    position:absolute;
    inset:6px;
    border-radius:50%;
    background: var(--black);
  }

  @keyframes spin{
    to{ transform:rotate(360deg); }
  }

  .circle-inner{
    position:absolute;
    inset:10px;
    border-radius:50%;
    overflow:hidden;
    background:#000;
    box-shadow:
      0 0 0 4px rgba(255,255,255,0.08),
      0 10px 40px var(--glow);
    animation: breathe 3.2s ease-in-out infinite;
  }

  .circle-inner img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  @keyframes breathe{
    0%,100%{ box-shadow:0 0 0 4px rgba(255,255,255,0.08), 0 10px 40px var(--glow); }
    50%{ box-shadow:0 0 0 4px rgba(255,255,255,0.14), 0 10px 55px var(--glow); }
  }

  @keyframes popIn{
    0%{ opacity:0; transform:scale(0.4); }
    60%{ opacity:1; transform:scale(1.08); }
    100%{ opacity:1; transform:scale(1); }
  }

  /* ---------- TEXT ---------- */
  .message{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:clamp(19px, 5.6vw, 23px);
    line-height:1.5;
    color:var(--cream);
    letter-spacing:0.2px;
    text-shadow: 0 2px 18px rgba(217,112,154,0.55);
    max-width:340px;
    opacity:0;
    transform:translateY(14px);
    animation: fadeUp 0.8s ease forwards 0.7s;
  }

  @keyframes fadeUp{
    to{ opacity:1; transform:translateY(0); }
  }

  /* ---------- BUTTON ---------- */
  .goodbye-btn{
    margin-top:32px;
    display:inline-flex;
    align-items:center;
    gap:9px;
    padding:14px 34px;
    border:none;
    border-radius:999px;
    background: linear-gradient(135deg, var(--pink-btn), #c15e88);
    color:#ffffff;
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:16px;
    letter-spacing:0.3px;
    cursor:pointer;
    box-shadow:
      0 6px 20px rgba(201,79,124,0.45),
      inset 0 1px 0 rgba(255,255,255,0.25);
    opacity:0;
    transform:translateY(12px) scale(0.9);
    transition: background 0.25s ease, box-shadow 0.25s ease, transform 0.15s ease;
    animation: popButton 0.7s cubic-bezier(.34,1.56,.64,1) forwards 1.4s;
  }

  @keyframes popButton{
    0%{ opacity:0; transform:translateY(12px) scale(0.8); }
    70%{ opacity:1; transform:translateY(-2px) scale(1.05); }
    100%{ opacity:1; transform:translateY(0) scale(1); }
  }

  .goodbye-btn:hover{
    background: linear-gradient(135deg, var(--pink-btn-hover), #a94f76);
    box-shadow:
      0 8px 26px rgba(201,79,124,0.6),
      inset 0 1px 0 rgba(255,255,255,0.3);
    transform:translateY(-2px) scale(1.03);
  }

  .goodbye-btn:active{
    transform:translateY(0) scale(0.97);
  }

  .goodbye-btn span.heart-inline{
    display:inline-block;
    animation: pulse 1.4s ease-in-out infinite;
  }

  @keyframes pulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.2); }
  }

  .goodbye-btn:focus-visible{
    outline: 3px solid #ffffff;
    outline-offset: 3px;
  }

  @media (prefers-reduced-motion: reduce){
    *{
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  @media (max-width: 380px){
    .circle-wrap{ width:160px; height:160px; }
  }
</style>
</head>
<body>

<div class="stage">

  <div class="circle-wrap">
    <div class="circle-ring"></div>
    <div class="circle-inner">
      <img src="bye.gif" alt="goodbye gif"
           onerror="this.onerror=null; this.replaceWith(Object.assign(document.createElement('div'), {innerHTML:'💗', style:'font-size:64px;display:flex;align-items:center;justify-content:center;height:100%;width:100%;background:#1a0d13;'}));">
    </div>
  </div>

  <p class="message">Wishing you a wonderful day ahead. It has been a pleasure, and I hope you continue to shine.</p>

  <button class="goodbye-btn" onclick="goIndex()">
    Goodbye <span class="heart-inline">💗</span>
  </button>

</div>

<script>
  function goIndex(){
    window.location.href = "index.html?" + Date.now();
  }

  // ambient sparkles, matching other pages
  function spawnSparkle(){
    const s = document.createElement('div');
    s.className = 'sparkle';
    const size = Math.random() * 3 + 2;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.animationDuration = (2.5 + Math.random() * 2.5) + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 6000);
  }
  setInterval(spawnSparkle, 500);

  const heartChars = ['💗','💕'];
  function spawnHeart(){
    const h = document.createElement('div');
    h.className = 'heart-float';
    h.textContent = heartChars[Math.floor(Math.random()*heartChars.length)];
    h.style.left = (55 + Math.random() * 40) + 'vw';
    h.style.bottom = '-5vh';
    h.style.fontSize = (12 + Math.random()*10) + 'px';
    h.style.animationDuration = (5 + Math.random()*3) + 's';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 9000);
  }
  setInterval(spawnHeart, 1400);
</script>

</body>
</html>
